# marketTon em produção (servidor). Só a tela (Caddy) expõe portas: 80 e 443. Banco e Redis ficam na rede interna.
#   cp .env.production.example .env.production   # preencher
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: marketton

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketton
      POSTGRES_USER: marketton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketton -d marketton"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://marketton:${POSTGRES_PASSWORD}@db:5432/marketton
      REDIS_URL: redis://redis:6379/0
      TZ: America/Sao_Paulo
    networks:
      default: {}
      # Rede interna do AI Studio (/opt/aistudio): o marketTon fala com `aistudio-api:8790` sem nenhuma porta pública.
      aistudio-edge:
        aliases: [marketton-api]
    volumes:
      # Casa do usuário do contêiner: guarda o login do Claude Code (e o próprio Claude) entre reinícios.
      - apphome:/home/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

networks:
  aistudio-edge:
    external: true
    name: aistudio-edge

volumes:
  pgdata:
  redisdata:
  apphome:
  caddy_data:
  caddy_config:
