# marketTon — Affiliate Intelligence System
# Infraestrutura de desenvolvimento: PostgreSQL + Redis + API.
#
# Uso:
#   docker compose up -d db redis      # somente a infraestrutura
#   docker compose up --build          # infraestrutura + API
#
# A API roda no host com `uvicorn backend.main:app --reload` durante o
# desenvolvimento; o serviço `api` existe para validar o build de produção.

services:
  db:
    image: postgres:16-alpine
    container_name: marketton-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketton}
      POSTGRES_USER: ${POSTGRES_USER:-marketton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketton}
      # Determinismo de ordenação para relatórios e testes.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketton} -d ${POSTGRES_DB:-marketton}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketton-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketton-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o host do banco é o nome do serviço.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketton}:${POSTGRES_PASSWORD:-marketton}@db:5432/${POSTGRES_DB:-marketton}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  redisdata:
